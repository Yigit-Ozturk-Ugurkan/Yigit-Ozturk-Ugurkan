<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <h2><a href="index.html" class="logo-link">UYÖ</a></h2>
    <nav>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="detail-page">
    <div class="detail-container">

      <a href="index.html#projects" class="back-link">← Back to Projects</a>

      <img id="projectImage" class="detail-image" alt="" hidden />

      <section class="detail-card">
        <h1 id="title"></h1>
        <p id="desc" class="detail-desc"></p>

        <div class="detail-buttons">
          <a id="github" class="btn" target="_blank" rel="noopener noreferrer" hidden>View on GitHub</a>
        </div>
        <p id="projectNote" class="detail-desc"></p>

        <hr />

        <h2>Highlights</h2>
        <ul id="highlights" class="detail-list"></ul>

        <hr />

        <h2>Technologies</h2>
        <div id="techTags" class="tags"></div>
      </section>

    </div>
  </main>

  <script src="projects.js"></script>
  <script>
    const project = new URLSearchParams(window.location.search).get("project");
    const data = window.portfolioProjects;
    const item = Object.hasOwn(data, project) ? data[project] : null;
    if (!item) {
      document.querySelector(".detail-container").innerHTML = '<section class="detail-card"><h1>Project not found</h1><p>The project you requested does not exist.</p><a href="index.html#projects" class="btn">Back to Projects</a></section>';
    } else {
      document.title = item.title + " | Uğurkan Yiğit Öztürk";
      document.documentElement.style.setProperty('--project-color', item.color);
      document.documentElement.style.setProperty('--project-soft-color', item.soft);
      document.getElementById('title').textContent = item.title;
      document.getElementById('desc').textContent = item.desc;
      document.getElementById('projectNote').textContent = item.note || '';
      if (item.image) {
        const image = document.getElementById('projectImage');
        image.src = item.image;
        image.alt = item.title;
        image.hidden = false;
      }
      if (item.github) {
        const link = document.getElementById('github');
        link.href = item.github;
        link.hidden = false;
      }
      item.highlights.forEach(point => {
        const li = document.createElement('li');
        li.textContent = point;
        document.getElementById('highlights').appendChild(li);
      });
      item.tech.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        document.getElementById('techTags').appendChild(span);
      });
    }
  </script>
</body>
</html>
